<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            padding: 40px 20px;
            color: #1e293b;
        }

        .form-card {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        h2 { color: #172554; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        label { font-size: 13px; font-weight: bold; }

        button {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        a { color: #2563eb; text-decoration: none; margin-left: 15px; }

        .errorlist { color: #dc2626; }
    </style>
</head>

<body>

<div class="form-card">

    <h2>Edit Profile</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>

        <a href="{% url 'account' %}">Cancel</a>
    </form>

</div>

</body>
</html>
